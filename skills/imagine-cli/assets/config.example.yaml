# imagine configuration template
#
# Save as ~/.config/imagine/config.yaml (on Linux/macOS/BSD)
#         %AppData%\imagine\config.yaml (on Windows)
#
# Prefer using `imagine providers add <name>` to build this file
# interactively — it preserves comments and handles field validation.
# This template is for users who want to hand-author it instead.
#
# Include ONLY the providers you actually use. Delete the others.
#
# Pick a default_provider when you have multiple configured — otherwise
# imagine picks the alphabetically-first one, which may surprise you.
# You can also set/change the default later with:
#   imagine providers use <name>
#   imagine providers select   (interactive picker)

default_provider: gemini         # image-gen default — one of: gemini, vertex, openai
# vision_default_provider: openai  # optional describe default; omit to use default_provider
                                   # set via: imagine providers use <name> --vision

providers:

  # Gemini (direct REST, API key auth)
  # Get a free key at https://aistudio.google.com/app/apikey
  # Or: imagine providers add gemini --api-key AIza-...
  gemini:
    api_key: AIza-paste-your-gemini-key-here
    # vision_model: gemini-pro-latest    # optional describe model override

  # OpenAI (GPT Image + GPT-5.5 vision) — two auth methods, pick one:
  #   API key:       imagine providers add openai --api-key sk-...   (org verification req'd)
  #   Subscription:  imagine providers add openai login   (browser sign-in, billed to your ChatGPT plan)
  openai:
    auth_method: api_key               # "api_key" or "subscription"
    api_key: sk-paste-your-openai-key-here   # only for auth_method: api_key
    # vision_model: gpt-5.5            # optional describe model override (default: gpt-5.5)
    # For subscription auth, just: { auth_method: subscription } — tokens are stored separately.

  # Vertex AI (Gemini via GCP, ADC auth)
  # Setup on this machine:
  #   1. A GCP project with the Vertex AI API enabled
  #   2. Run: gcloud auth application-default login
  # No API key needed — ADC handles auth.
  # Or: imagine providers add vertex --gcp-project <id> --location <region>
  vertex:
    gcp_project: your-gcp-project-id
    location: global                   # optional — "global" is the default
    # vision_model: gemini-3-flash-preview  # optional describe model override

  # fal (video — Seedance 2.0). Key: https://fal.ai/dashboard/keys
  # Or: imagine providers add fal --api-key fal-...
  # Uploads references to fal's own CDN — no storage: section needed.
  fal:
    api_key: fal-paste-your-key-here

  # modelark (video — Seedance 2.0 via BytePlus ModelArk).
  # Or: imagine providers add modelark --api-key ark-...
  # References (-i) are uploaded to YOUR S3 bucket — configure storage: below.
  modelark:
    api_key: ark-paste-your-key-here

# Storage — S3-compatible bucket for modelark references (image/video/audio; omit if unused).
# Must be a DEDICATED, PUBLIC-READ bucket: modelark fetches references over the
# public internet with no credentials. Verify with: imagine storage test
# Configure via: imagine storage set --endpoint ... --bucket ... --access-key ... --secret-key ...
# storage:
#   endpoint: "https://tos-ap-southeast-1.bytepluses.com"  # BytePlus TOS extranet host
#   region: "ap-southeast-1"
#   bucket: "my-imagine-bucket"
#   access_key: "AK..."                # supports ${ENV} / op://
#   secret_key: "${S3_SECRET}"         # supports ${ENV} / op://
#   path_prefix: "imagine-refs/"       # optional
#   path_style: false                  # true for MinIO/RustFS; false (default) for BytePlus TOS
